[program:jenkins]
command=/usr/bin/java -jar /opt/jenkins/jenkins.war --httpPort=8080 --httpListenAddress=0.0.0.0
user=devops
environment=HOME="/home/devops",JENKINS_HOME="/var/jenkins_home"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:code-server]
command=/usr/bin/code-server --config /home/devops/.config/code-server/config.yaml /workspace
user=devops
environment=HOME="/home/devops"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
