; Run Jenkins as a supervised local service.
[program:jenkins]
; Start this service with its configured port or configuration file.
command=/usr/bin/java -jar /opt/jenkins/jenkins.war --httpPort=8080 --httpListenAddress=0.0.0.0
; Run the service as the devops user.
user=devops
; Pass the persistent home and service-specific environment.
environment=HOME="/home/devops",JENKINS_HOME="/var/jenkins_home"
; Restart the service if its process exits unexpectedly.
autorestart=true
; Send standard output to Docker container logs.
stdout_logfile=/dev/stdout
; Disable log rotation for the stdout device stream.
stdout_logfile_maxbytes=0
; Send errors to Docker container logs.
stderr_logfile=/dev/stderr
; Disable log rotation for the stderr device stream.
stderr_logfile_maxbytes=0

; Run the browser editor as a supervised local service.
[program:code-server]
; Start this service with its configured port or configuration file.
command=/usr/bin/code-server --config /home/devops/.config/code-server/config.yaml /workspace
; Run the service as the devops user.
user=devops
; Pass the persistent home and service-specific environment.
environment=HOME="/home/devops"
; Restart the service if its process exits unexpectedly.
autorestart=true
; Send standard output to Docker container logs.
stdout_logfile=/dev/stdout
; Disable log rotation for the stdout device stream.
stdout_logfile_maxbytes=0
; Send errors to Docker container logs.
stderr_logfile=/dev/stderr
; Disable log rotation for the stderr device stream.
stderr_logfile_maxbytes=0
